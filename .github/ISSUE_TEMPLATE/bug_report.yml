name: Bug report
description: Report a reproducible problem in Duavara
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Duavara. Do not include private location data, API responses containing personal information, signing material, passwords, or tokens.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and briefly.
      placeholder: Prayer reminders remain enabled after I turn them off.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that consistently show the problem.
      placeholder: |
        1. Open Prayer settings.
        2. Enable a prayer reminder.
        3. Disable the reminder.
        4. Reopen settings.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error message exactly as shown, if applicable.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
        - Not platform-specific
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version or preview tag
      description: For example, 1.0.0 or preview-abcdef123456.
      placeholder: 1.0.0
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Device and OS
      description: Include device model and Android/iOS version. Do not include identifiers.
      placeholder: Pixel 8, Android 16
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private coordinates, personal data, credentials, tokens, and signing information from this report.
          required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Optional. Attach redacted screenshots or logs only when they help reproduce the issue.
